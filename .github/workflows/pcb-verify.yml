name: PCB Verify

# CI is the authority on whether a schematic is released. Claude and any other agent may
# edit source files; neither gets to decide whether the result passes. The release verdict
# is recomputed here on a clean checkout from schemas, tests, deterministic checks and
# stored human approvals.
#
# Path-filtered on purpose: this repository's Update Daily Code workflow commits every ten
# minutes, and those commits touch nothing here.

on:
  push:
    paths:
      - 'pcb-verify/**'
      - '.github/workflows/pcb-verify.yml'
  pull_request:
    paths:
      - 'pcb-verify/**'
      - '.github/workflows/pcb-verify.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: pcb-verify

jobs:
  verify:
    name: Schemas, corpus and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Validate every schema and artifact
        run: pcbv validate

      - name: Run the known-good / known-bad corpus
        run: pcbv corpus

      - name: Unit and corpus tests
        # KiCad-oracle tests skip here and run in the kicad-oracle job instead.
        run: python -m pytest -q

      - name: Show the canonical gate model
        run: pcbv gates

      # The pipeline must not be able to claim a release while gates are unimplemented.
      # `pcbv release` exits non-zero for NOT_RELEASED, so success here would mean the
      # derived-status logic had broken open.
      - name: Assert the corpus design is NOT_RELEASED
        run: |
          if pcbv release tests/corpus/known_good/minimal_ldo > /dev/null; then
            echo "::error::release verdict came back SCHEMATIC_RELEASED while gates are unimplemented"
            exit 1
          fi
          echo "release verdict is correctly NOT_RELEASED"

  kicad-oracle:
    name: KiCad accepts the fixtures and agrees with our readers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # Installed from the Ubuntu archive rather than a third-party container image, because
      # this is the exact provenance the fixtures were verified against during development.
      # Ubuntu 24.04 ships KiCad 7.0.x. Note that `kicad-cli sch erc` does not exist before
      # KiCad 8.0, so ERC is not run here -- CHK-ERC lands in Phase 1 together with a KiCad
      # 8+ toolchain. Claiming an ERC pass on a KiCad that cannot run ERC would be exactly
      # the kind of hollow green check this project exists to prevent.
      - name: Install KiCad
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends kicad

      # Fails the job outright if KiCad is missing, so the oracle tests can never be
      # silently skipped into a green run.
      - name: Confirm kicad-cli is present
        run: kicad-cli version

      - name: Every fixture loads in KiCad, and our readers agree with it
        run: python -m pytest -m requires_kicad -q -rs

      - name: Guard against the oracle tests being skipped
        run: |
          set -euo pipefail
          out="$(python -m pytest -m requires_kicad -q -rs 2>&1 | tail -5)"
          echo "$out"
          if echo "$out" | grep -qi 'skipped'; then
            echo "::error::KiCad-oracle tests were skipped; fixture validity is unverified"
            exit 1
          fi

      - name: Full suite with KiCad available
        run: python -m pytest -q
