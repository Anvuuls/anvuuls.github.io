# The connector's contacts are named P1/P2 by the manufacturer. The corpus schematic uses
# VIN and GND as the symbol pin names, declared here as aliases -- that is the legitimate
# use of the alias field, and it is why the reversed_connector_pinout case is detectable:
# an alias permits an alternative NAME for a given contact NUMBER, never a different
# number.

mpn: EXAMPLE-CONN-2P
package: CONN-1x02-P2.54

