  section: Section 2 Pin Assignment
  table: Table 2-1
  transcribed_by: corpus fixture
  transcribed_at: '2026-08-17'

pins:
  - number: '1'
    name: P1
    type: passive
    aliases: [VIN]
    function: Contact 1, nearest the chamfered corner marking
    must_connect: true
    evidence:
      - source_id: EX-CN-0002
        table: Table 2-1
        snippet: '1     P1      passive   Contact 1, nearest the chamfered corner marking.'

  - number: '2'
    name: P2
    type: passive
    aliases: [GND]
    function: Contact 2
    must_connect: true
    evidence:
      - source_id: EX-CN-0002
        table: Table 2-1
        snippet: '2     P2      passive   Contact 2.'
